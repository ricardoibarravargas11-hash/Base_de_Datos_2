<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">BD<span>II</span></div><nav><a href="index.html">Ver sitio</a></nav></header><main><p class="eyebrow">PANEL DE ADMINISTRACIÓN</p><h1>Gestionar recursos</h1><div class="card"><h2>Archivos por semana</h2><p class="lead">Selecciona una semana y prepara archivos PDF o imágenes para publicarlos en el repositorio.</p><select id="w" style="padding:12px;width:100%;margin:10px 0"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option></select><input id="files" type="file" accept=".pdf,image/jpeg,image/png,image/webp" multiple style="padding:12px;width:100%"><p id="list" class="lead"></p><button class="btn" id="save">Preparar publicación</button></div></main><script>files.onchange=()=>{list.textContent=[...files.files].map(f=>f.name).join(' · ')||'No hay archivos seleccionados'};save.onclick=()=>{alert('Archivos preparados para la Semana '+w.value+'. La publicación directa requiere autorización de GitHub en un servicio seguro.');}</script></body></html>
