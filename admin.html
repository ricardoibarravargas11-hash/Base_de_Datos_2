<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrador | BD II</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">BD<span>II</span></div><nav><a href="index.html">Ver sitio</a></nav></header><main><p class="eyebrow">PANEL PRIVADO</p><h1>Publicar recursos</h1><p class="lead">Sube PDF o imágenes directamente a GitHub. El token no se guarda en el código.</p><div class="card"><label>Token de GitHub</label><input id="token" type="password" placeholder="github_pat_…" autocomplete="off" style="width:100%;padding:13px;margin:8px 0 18px"><label>Semana</label><select id="week" style="width:100%;padding:13px;margin:8px 0 18px"><option value="1">Semana 1</option><option value="2">Semana 2</option><option value="3">Semana 3</option><option value="4">Semana 4</option><option value="5">Semana 5</option><option value="6">Semana 6</option><option value="7">Semana 7</option><option value="8">Semana 8</option><option value="9">Semana 9</option><option value="10">Semana 10</option><option value="11">Semana 11</option><option value="12">Semana 12</option><option value="13">Semana 13</option><option value="14">Semana 14</option><option value="15">Semana 15</option><option value="16">Semana 16</option></select><label>Archivos</label><input id="files" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp,application/pdf,image/jpeg,image/png,image/webp" multiple style="width:100%;padding:13px;margin:8px 0"><p id="status" class="lead">PDF/JPG/PNG/WEBP · máximo 8 MB por archivo.</p><button class="btn" id="upload">Publicar en GitHub</button></div></main><script>
const owner="ricardoibarravargas11-hash",repo="Base_de_Datos_2",branch="main",api="https://api.github.com";
const el=id=>document.getElementById(id);
el("files").onchange=()=>el("status").textContent=[...el("files").files].map(f=>f.name).join(" · ")||"No hay archivos seleccionados";
const ok=f=>/^(application\/pdf|image\/(jpeg|png|webp))$/i.test(f.type)||/\.(pdf|jpe?g|png|webp)$/i.test(f.name);
const b64=f=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(",")[1]);r.onerror=reject;r.readAsDataURL(f)});
el("upload").onclick=async()=>{const token=el("token").value.trim(),files=[...el("files").files],week=el("week").value;if(!token)return el("status").textContent="Ingresa tu token de GitHub.";if(!files.length)return el("status").textContent="Selecciona al menos un archivo.";if(files.some(f=>!ok(f)))return el("status").textContent="Solo PDF, JPG, JPEG, PNG o WEBP.";if(files.some(f=>f.size>8*1024*1024))return el("status").textContent="Un archivo supera 8 MB.";el("upload").disabled=true;try{for(const f of files){const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_"),path="semanas/"+week+"/"+safe;const q=await fetch(api+"/repos/"+owner+"/"+repo+"/contents/"+path,{headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json"}});let sha;if(q.ok)sha=(await q.json()).sha;const body={message:"BD II: "+safe+" - Semana "+week,content:await b64(f),branch};if(sha)body.sha=sha;const put=await fetch(api+"/repos/"+owner+"/"+repo+"/contents/"+path,{method:"PUT",headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});if(!put.ok)throw new Error((await put.json()).message||"GitHub rechazó el archivo")}el("status").textContent="✓ Publicado correctamente en Semana "+week+".";el("files").value=""}catch(e){el("status").textContent="Error: "+e.message}finally{el("upload").disabled=false}};
</script></body></html>
