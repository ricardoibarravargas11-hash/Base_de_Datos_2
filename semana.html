<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semana | Base de Datos II</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><div class="nav"><a class="brand" href="index.html"><span class="brand-mark">BD</span><span>BASE DE DATOS II<small>RECURSOS SEMANALES</small></span></a><nav class="navlinks"><a href="index.html">Inicio</a><a href="unidad1.html">Unidades</a><a href="recursos.html">Recursos</a><a href="perfil.html">Perfil</a></nav></div></header>
<main><p class="eyebrow" id="unit">SEMANA</p><h1 id="title">Cargando…</h1><p class="lead" id="desc">Aquí se muestran automáticamente todos los archivos publicados para esta semana.</p><div id="resources" class="resource-list"></div><div class="actions"><a class="btn secondary" href="index.html#unidades">← Volver</a></div></main>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><strong id="modalTitle">Vista previa</strong><button class="modal-close" id="closeModal">Cerrar ✕</button></div><div id="modalBody" style="flex:1;min-height:0"></div></div></div>
<footer>Base de Datos II · UPLA</footer>
<script>
const p=new URLSearchParams(location.search),w=Math.min(16,Math.max(1,Number(p.get("semana"))||1)),u=w<=4?1:w<=8?2:w<=12?3:4;
document.getElementById("unit").textContent="UNIDAD "+String(u).padStart(2,"0")+" · SEMANA "+String(w).padStart(2,"0");
document.getElementById("title").textContent="Semana "+w;
const box=document.getElementById("resources");
const modal=document.getElementById("modal"),body=document.getElementById("modalBody");
function preview(name,url,type){document.getElementById("modalTitle").textContent=name;body.innerHTML=type==="PDF"?'<iframe class="preview-frame" src="'+url+'"></iframe>':'<img class="preview-image" src="'+url+'" alt="'+name+'">';modal.classList.add("open")}
document.getElementById("closeModal").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
fetch("https://api.github.com/repos/ricardoibarravargas11-hash/Base_de_Datos_2/contents/semanas/"+w).then(r=>r.ok?r.json():[]).then(xs=>{
 const fs=Array.isArray(xs)?xs.filter(x=>x.type==="file"):[];
 if(!fs.length){box.innerHTML='<div class="empty">Aún no hay recursos publicados en esta semana.</div>';return}
 box.innerHTML=fs.map(f=>{const type=(f.name.split(".").pop()||"FILE").toUpperCase();return '<div class="resource"><div><div class="type">'+type+'</div><strong>'+f.name+'</strong></div><button class="btn" data-url="'+encodeURIComponent(f.download_url)+'" data-name="'+encodeURIComponent(f.name)+'" data-type="'+type+'">Ver dentro del portal →</button></div>'}).join("");
 box.querySelectorAll("button").forEach(b=>b.onclick=()=>preview(decodeURIComponent(b.dataset.name),decodeURIComponent(b.dataset.url),b.dataset.type));
}).catch(()=>box.innerHTML='<div class="empty">No se pudo consultar el contenido en este momento.</div>');
</script></body></html>
