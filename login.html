<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Portafolio Base de Datos II</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body::before{ opacity:.06; }
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    width:100%; max-width:380px; border:1px solid var(--line); background:var(--bg-panel);
    border-radius:6px; padding:40px 34px; position:relative; z-index:1;
  }
  .login-card .crest{ width:72px; margin:0 auto 20px; display:block; }
  .login-card h1{ font-family:var(--font-display); font-size:20px; text-align:center; margin:0 0 4px; }
  .login-card .sub{ text-align:center; color:var(--text-dim); font-size:12.5px; font-family:var(--font-mono); margin-bottom:28px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
  .field input{
    width:100%; padding:11px 12px; background:var(--bg); border:1px solid var(--line);
    border-radius:4px; color:var(--text); font-family:var(--font-body); font-size:14px;
  }
  .field input:focus{ outline:none; border-color:var(--gold); }
  .login-btn{
    width:100%; margin-top:8px; padding:13px; font-family:var(--font-display); font-weight:600;
    font-size:14.5px; background:var(--gold); color:var(--bg); border:none; border-radius:4px; cursor:pointer;
  }
  .login-btn:hover{ opacity:.88; }
  .login-note{ text-align:center; margin-top:16px; font-size:12px; color:var(--text-dim); }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <img class="crest" src="assets/img/logo-upla.png" alt="Escudo UPLA">
    <h1>Portafolio Base de Datos II</h1>
    <div class="sub">UNIVERSIDAD PERUANA LOS ANDES</div>

    <form id="loginForm">
      <div class="field">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="ricardo.ibarra" required>
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" placeholder="••••••••" required>
      </div>
      <button type="submit" class="login-btn">Iniciar sesión</button>
    </form>
    <div class="login-note">Acceso de demostración — cualquier dato ingresado permite entrar.</div>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    sessionStorage.setItem('bd2_logged_in', 'true');
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
