<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recursos | Base de Datos II</title><link rel="stylesheet" href="style.css?v=20260920"></head><body>
<header class="site-header"><div class="nav"><a class="brand" href="index.html"><span class="brand-mark">BD</span><span>BASE DE DATOS II<small>PORTAFOLIO ACADÉMICO</small></span></a><nav class="navlinks"><a href="index.html">Inicio</a><a href="progreso.html">Progreso</a><a class="active" href="recursos.html">Recursos</a><a href="perfil.html">Perfil</a><a href="login.html">Administrador</a></nav></div></header>
<main><section class="section-head" style="margin-top:0"><div><p class="eyebrow">Biblioteca académica</p><h2>Todos los recursos</h2><p>Busca y visualiza los archivos publicados en las 16 semanas.</p></div></section>
<div class="info-grid"><div class="info"><strong>Buscar</strong><input id="search" style="width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#071522;color:var(--text)" placeholder="Nombre del archivo..."></div><div class="info"><strong>Semana</strong><select id="week" style="width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#071522;color:var(--text)"><option value="">Todas las semanas</option></select></div><div class="info"><strong>Tipo</strong><select id="type" style="width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);background:#071522;color:var(--text)"><option value="">Todos los formatos</option><option>PDF</option><option>JPG</option><option>JPEG</option><option>PNG</option><option>WEBP</option></select></div></div>
<div id="summary" class="status">Cargando biblioteca…</div><div id="list" class="resource-list"></div></main>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-head"><strong id="modalTitle">Vista previa</strong><button class="modal-close" id="closeModal">Cerrar ✕</button></div><div id="modalBody" style="flex:1;min-height:0"></div></div></div>
<footer>© 2026 Ricardo Ibarra Vargas · Base de Datos II</footer>
<script>
const repo="ricardoibarravargas11-hash/Base_de_Datos_2",list=document.getElementById("list"),search=document.getElementById("search"),week=document.getElementById("week"),type=document.getElementById("type"),summary=document.getElementById("summary"),modal=document.getElementById("modal"),body=document.getElementById("modalBody");let resources=[];
for(let i=1;i<=16;i++)week.insertAdjacentHTML("beforeend","<option value='"+i+"'>Semana "+String(i).padStart(2,"0")+"</option>");
function preview(name,url,t){document.getElementById("modalTitle").textContent=name;body.innerHTML=t==="PDF"?'<iframe class="preview-frame" src="'+url+'"></iframe>':'<img class="preview-image" src="'+url+'" alt="'+name+'">';modal.classList.add("open")}
document.getElementById("closeModal").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
async function load(){const data=await Promise.all(Array.from({length:16},(_,i)=>fetch("https://api.github.com/repos/"+repo+"/contents/semanas/"+(i+1)).then(r=>r.ok?r.json():[]).catch(()=>[])));resources=data.flatMap((items,i)=>(Array.isArray(items)?items:[]).filter(x=>x.type==="file").map(x=>({name:x.name,week:i+1,url:x.download_url,type:(x.name.split(".").pop()||"FILE").toUpperCase()})));render()}
function render(){const q=search.value.toLowerCase().trim(),w=week.value,t=type.value,filtered=resources.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!w||x.week==w)&&(!t||x.type===t));summary.textContent=filtered.length+" recurso"+(filtered.length===1?"":"s")+" encontrado"+(filtered.length===1?"":"s")+" · "+resources.length+" publicado"+(resources.length===1?"":"s");list.innerHTML=filtered.length?filtered.map(x=>"<div class=\"resource\"><div><div class=\"type\">SEMANA "+String(x.week).padStart(2,"0")+" · "+x.type+"</div><strong>"+x.name+"</strong></div><button class=\"btn secondary\" data-url=\""+encodeURIComponent(x.url)+"\" data-name=\""+encodeURIComponent(x.name)+"\" data-type=\""+x.type+"\">Ver aquí ↗</button></div>").join(""):"<div class=\"empty\">No hay recursos que coincidan con los filtros.</div>";list.querySelectorAll("button").forEach(b=>b.onclick=()=>preview(decodeURIComponent(b.dataset.name),decodeURIComponent(b.dataset.url),b.dataset.type))}
search.oninput=render;week.onchange=render;type.onchange=render;load();
</script></body></html>
